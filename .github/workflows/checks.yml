name: Valometra checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options:
          - test
          - production
        default: test
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: npm test
  python-quality:
    name: Qualité Python
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/python-quality-requirements.txt
      - name: Vérifier les dépendances Python
        shell: bash
        run: |
          echo '## Audit des dépendances Python' >> "$GITHUB_STEP_SUMMARY"
          python -m pip_audit -r .github/python-quality-requirements.txt 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vérifier Bandit, Pylint et la couverture
        if: success() || failure()
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head=$(git rev-parse HEAD)
          commits=$head
          if [[ "$EVENT" == push ]]; then
            if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              BEFORE=$(git merge-base "$head" "origin/$DEFAULT_BRANCH")
            fi
            commits=$(git rev-list --reverse --first-parent "$BEFORE..$head")
            commits=${commits:-$head}
          fi

          failed=0
          for commit in $commits; do
            git checkout --detach "$commit"
            test -f scripts/build_dataviz.py
            test -f scripts/export_dataviz_sql.py
            test -f tests/dataviz_data.py
            printf '## Qualité Python · `%s`\n\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
            printf '### Bandit\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            python -m bandit --severity-level medium --ignore-nosec \
              scripts/build_dataviz.py scripts/export_dataviz_sql.py tests/dataviz_data.py \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
            printf '### Pylint\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            python -m pylint --persistent=no --fail-under=9.5 \
              scripts/build_dataviz.py scripts/export_dataviz_sql.py tests/dataviz_data.py \
              | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            printf '```\n\n### Couverture\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            python -m pytest tests/dataviz_data.py \
              --cov=build_dataviz --cov=export_dataviz_sql --cov-branch \
              --cov-fail-under=80 --cov-report=term-missing \
              | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
  deploy-test:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.VALOMETRA_PRIVATE_TEST_READY == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'test'))
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-test
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python3 scripts/build_cloudflare.py --test
      - name: Deploy the protected test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test_url=https://valometra-test.valometra-grenoble.workers.dev
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            exit 0
          fi
          npx --yes wrangler@4.166.0 deploy --config dist/cloudflare/wrangler.json
          for path in / /js/inference-worker.js /models/model.py; do
            status=$(curl --silent --show-error --retry 4 --max-time 20 --output /dev/null --write-out '%{http_code}' "$test_url$path")
            if [[ "$status" != 401 ]]; then
              echo "::error::Expected authentication on $path, received HTTP $status."
              exit 1
            fi
          done
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python3 scripts/build_cloudflare.py
      - name: Deploy current main to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Skipping this deployment."
            exit 0
          fi
          npx --yes wrangler@4.166.0 deploy --config dist/cloudflare/wrangler.json
          site=https://valometra-estimation.valometra-grenoble.workers.dev
          for path in / /js/inference-worker.js /models/model.py; do
            echo "Checking $path"
            curl --fail --silent --show-error --retry 4 --max-time 20 "$site$path" --output /dev/null
          done
